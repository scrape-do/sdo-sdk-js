# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Every job runs on GitHub-hosted runners: free for a public repository, a
# clean image every time, and no code from outside the org ever reaches the
# org's persistent self-hosted runners. CodeQL is the one exception: its result
# upload and its own status calls are GitHub API requests, which the org's IP
# allow list only accepts from the self-hosted runners, so it runs there for
# same-repository events only; a pull request from a fork is not analysed
# (its code must not reach those runners) and is analysed on main once merged.

jobs:
  # Formatting, lint rules and import order (biome.json), like ruff in the
  # Python SDK and gofmt/go vet in the Go SDK.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22", "24"] # engines.node's floor, and the current release
        include:
          - { os: macos-latest, node: "24" }
          - { os: windows-latest, node: "24" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      # dist/ must hold only this SDK's code (no bundled node_modules), and the
      # ESM build, the CJS build and node16 TypeScript consumers must all load it.
      - run: npm run check:dist

  api-surface:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Regenerate public API surface golden
        run: npm run api:surface
      - name: Fail on API surface drift
        run: |
          if ! git diff --exit-code -- api-surface.txt || [ -n "$(git status --porcelain -- api-surface.txt)" ]; then
            echo "::error::Public API surface changed. Review the diff above, then run 'npm run api:surface' and commit the updated api-surface.txt."
            exit 1
          fi

  # Every commit of a pull request needs a Conventional Commit subject and a DCO
  # sign-off (see CONTRIBUTING.md).
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional Commit subjects and DCO sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s\n' "$subject" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9/_.-]*\))?!?: .+'; then
              echo "::error::$sha: not a Conventional Commit subject: $subject"; fail=1
            fi
            # Bots (Dependabot) cannot certify the DCO; everyone else signs off.
            case "$(git log -1 --format=%ae "$sha")" in *'[bot]@users.noreply.github.com') continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::$sha: missing Signed-off-by trailer (commit with git commit -s)"; fail=1
            fi
          done
          exit "$fail"

  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # The persistent runners may still hold root-owned files that an older,
      # container-based job left in this workspace or in the runner's temp
      # directory (CodeQL writes its PR diff range there); reclaim both.
      - name: Reclaim the workspace
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP:/t" busybox:1.37.0@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4 chown -R "$(id -u):$(id -g)" /w /t
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # TypeScript extraction runs on Node.js, which the self-hosted runners
      # do not ship.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
