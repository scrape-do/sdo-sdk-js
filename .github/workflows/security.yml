# SPDX-License-Identifier: Apache-2.0
# Security battery: secret scan, dependency vuln scans, SBOM, and supply-chain
# posture. Every action is SHA-pinned.
name: security

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against unchanged code still surfaces.
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

# Advisories accepted for a limited time, one per line:
#   <advisory id> <expiry, YYYY-MM-DD> <reason>
# Both dependency scans below build their ignore list from this variable only:
# an osv-scanner.toml elsewhere in the checkout is ignored, so accepting an
# advisory is always a visible change to this workflow. After the expiry date the advisory fails
# both jobs again; re-assess it then. Dependabot opens a pull request as soon as
# a patched version exists.
env:
  ACCEPTED_ADVISORIES: |-
    GHSA-fc5q-39xc-vjpf 2026-12-18 picomatch ReDoS, no patched release (<= 4.0.7 affected); reached only through the dev tools tsup and vitest, which match repository-defined globs, and @scrape-do/sdo-client ships no dependencies

# Every job runs on GitHub-hosted runners except Scorecard, which reads the
# repository through the GitHub API: the org's IP allow list only accepts
# those calls from the self-hosted runners.

jobs:
  # Secret scanning across the full git history. Uses a version-pinned, checksum
  # -verified gitleaks binary (license-free, no org entitlement required).
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for a complete secret scan
          persist-credentials: false
      - name: Scan git history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # The config and the ignore list come from this workflow, never from the
          # checkout: a pull request could otherwise add a .gitleaks.toml or a
          # .gitleaksignore that allowlists the secret it introduces.
          cfg="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          printf '[extend]\nuseDefault = true\n' > "$cfg/gitleaks.toml"
          ./gitleaks git . --no-banner --redact --exit-code 1 \
            --config "$cfg/gitleaks.toml" --gitleaks-ignore-path "$cfg"

  # Dependency vulnerability scan against the OSV database (npm lockfile).
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The config is generated here and passed with --config, which replaces
      # any osv-scanner.toml in the checkout.
      - name: Write the scanner config from ACCEPTED_ADVISORIES
        run: |
          set -euo pipefail
          out=osv-scanner.ci.toml
          : > "$out"
          while read -r id until reason; do
            [ -n "$id" ] || continue
            reason="${reason//\\/}"; reason="${reason//\"/}"
            printf '[[IgnoredVulns]]\nid = "%s"\nignoreUntil = %sT00:00:00Z\nreason = "%s"\n\n' "$id" "$until" "$reason" >> "$out"
          done <<< "$ACCEPTED_ADVISORIES"
          cat "$out"
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=./osv-scanner.ci.toml
            --lockfile=./package-lock.json

  # Native npm advisory audit as a second dependency gate.
  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # npm audit has no per-advisory ignore, so the gate is applied here: any
      # high or critical advisory fails the job unless ACCEPTED_ADVISORIES lists
      # it and its expiry date has not passed.
      - name: npm audit (high and critical)
        run: |
          set -uo pipefail
          npm audit --json > audit.json || true
          node - <<'JS'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          if (report.error) { console.error("npm audit failed:", report.error.summary || report.error); process.exit(1); }
          const today = new Date().toISOString().slice(0, 10);
          const accepted = new Map();
          for (const line of (process.env.ACCEPTED_ADVISORIES || "").split("\n")) {
            const [id, until, ...reason] = line.trim().split(/\s+/);
            if (id) accepted.set(id, { until, reason: reason.join(" ") });
          }
          const found = new Map();
          for (const [pkg, v] of Object.entries(report.vulnerabilities || {})) {
            for (const via of v.via || []) {
              if (typeof via !== "object" || !["high", "critical"].includes(via.severity)) continue;
              const id = (via.url || "").split("/").pop() || String(via.source);
              found.set(id, { pkg, severity: via.severity, title: via.title, range: via.range });
            }
          }
          let failed = false;
          for (const [id, f] of found) {
            const a = accepted.get(id);
            if (a && today <= a.until) {
              console.log(`accepted until ${a.until}: ${id} ${f.severity} ${f.pkg} ${f.range} (${f.title})`);
            } else {
              failed = true;
              const why = a ? `acceptance expired on ${a.until}` : "not accepted";
              console.log(`::error::${id} ${f.severity} in ${f.pkg} ${f.range}: ${f.title} (${why})`);
            }
          }
          for (const [id, a] of accepted) {
            if (!found.has(id)) console.log(`::notice::${id} is accepted until ${a.until} but npm audit no longer reports it; remove it from ACCEPTED_ADVISORIES.`);
          }
          console.log(`${found.size} high/critical advisories, ${failed ? "some not accepted" : "all accepted"}.`);
          process.exit(failed ? 1 : 0);
          JS

  # Generate an SPDX SBOM (syft) and upload it as a workflow artifact.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sdo-sdk-js.spdx.json
          artifact-name: sdo-sdk-js.spdx.json
          upload-artifact: true

  # OpenSSF Scorecard — supply-chain posture, for the default branch only
  # (pushes to main and the weekly run). It reads the repository through the
  # GitHub API, which the org's IP allow list only permits from the self-hosted
  # runners; results go to code scanning.
  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      # The persistent runners may still hold root-owned files that an older,
      # container-based job left in this workspace or in the runner's temp
      # directory; reclaim both.
      - name: Reclaim the workspace
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP:/t" busybox:1.37.0@sha256:66a6306db78bf2dbf3487f293aa8d6990d8e506fdffab9cc43fe422becf886e4 chown -R "$(id -u):$(id -g)" /w /t
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
