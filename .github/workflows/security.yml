# SPDX-License-Identifier: Apache-2.0
# Security battery: secret scan, dependency vuln scans, SBOM, and supply-chain
# posture. Every action is SHA-pinned. These run on GitHub (not locally); they
# are validated here by YAML parse + verified action pinning.
name: security

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory against unchanged code still surfaces.
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

# Every job runs on GitHub-hosted runners except Scorecard, which reads the
# repository through the GitHub API: the org's IP allow list only accepts
# those calls from the self-hosted runners.

jobs:
  # Full git-history secret scan with a pinned, checksum-verified gitleaks binary.
  # The gitleaks GitHub Action requires a paid license for organization-owned
  # repos, so we run the OSS binary directly (license-free) instead.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      - name: Scan full history for secrets
        # The config and the ignore list come from this workflow, never from the
        # checkout: a pull request could otherwise add a .gitleaks.toml or a
        # .gitleaksignore that allowlists the secret it introduces.
        run: |
          set -euo pipefail
          cfg="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          printf '[extend]\nuseDefault = true\n' > "$cfg/gitleaks.toml"
          ./gitleaks git . --redact -v --log-opts="--all" \
            --config "$cfg/gitleaks.toml" --gitleaks-ignore-path "$cfg"

  # Dependency vulnerability scan against the OSV database (npm lockfile).
  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=./package-lock.json

  # Native npm advisory audit as a second dependency gate.
  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm audit --audit-level=high

  # Generate an SPDX SBOM (syft) and upload it as a workflow artifact.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

  # OpenSSF Scorecard — supply-chain posture, for the default branch only
  # (pushes to main and the weekly run). It reads the repository through the
  # GitHub API, which the org's IP allow list only permits from the self-hosted
  # runners; results go to code scanning.
  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      # The persistent runners may still hold root-owned files that an older,
      # container-based job left in this workspace; reclaim them before the
      # checkout cleans it.
      - name: Reclaim the workspace
        working-directory: ${{ github.workspace }}
        run: docker run --rm -v "$PWD:/w" golang:1.27 chown -R "$(id -u):$(id -g)" /w
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
