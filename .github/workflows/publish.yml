# SPDX-License-Identifier: Apache-2.0
# Split build/test (untrusted) -> minimal publish via npm trusted publishing
# (OIDC, no stored token) with provenance. See CONTRIBUTING.md, "Releasing".
#
# The build job refuses a tag that does not match package.json and
# src/version.ts, or that is not on main. The publish job skips (with a notice)
# a version that is already on npm, so re-running a release that already
# uploaded does not fail.
#
# Two channels, chosen by the tag (trunk-based: every tag is on main):
#   vX.Y.Z-rc.N -> npm dist-tag `next`   (environment `prerelease`)
#   vX.Y.Z      -> npm dist-tag `latest` (environment `release`)
name: publish

on:
  push:
    tags: ["v*"]
  # Manual run: checks the npm trusted-publisher exchange for this workflow
  # without publishing anything (see the publisher-check job).
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # Forks and mirrors never publish; a manual run only checks the publisher.
    if: github.repository_owner == 'scrape-do' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches, for the main-ancestry check
          persist-credentials: false
      - name: Check the tag matches package.json and src/version.ts
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          src="v$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/version.ts)"
          if [ "$GITHUB_REF_NAME" != "$pkg" ] || [ "$GITHUB_REF_NAME" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($pkg) and src/version.ts ($src)" >&2
            exit 1
          fi
      - name: Pick the channel from the tag
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "channel=test" >> "$GITHUB_OUTPUT"; echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=live" >> "$GITHUB_OUTPUT"; echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$GITHUB_REF_NAME is neither vX.Y.Z nor vX.Y.Z-rc.N" >&2
            exit 1
          fi
      - name: Refuse tags that are not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - run: npm run check:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/
            package.json
            CHANGELOG.md
            README.md
            LICENSE
            NOTICE

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Manual approval gate: `prerelease` for release candidates, `release` for finals.
    environment: ${{ needs.build.outputs.channel == 'test' && 'prerelease' || 'release' }}
    permissions:
      id-token: write               # trusted publishing + provenance via OIDC
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Require npm >= 11.5.1
        run: |
          node -e '
            const [a, b, c] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm " + [a, b, c].join(".") + " cannot use trusted publishing; need >= 11.5.1");
              process.exit(1);
            }'
      - name: Skip a version that is already on npm
        id: registry
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@scrape-do/sdo-client@${version}" version --json >/dev/null 2>&1; then
            echo "::notice::@scrape-do/sdo-client@${version} is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published == 'false'
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          # Fallback only: npm tries trusted publishing (OIDC) first and uses this
          # token when the exchange fails. The registry refuses the exchange for
          # repositories with GitHub's immutable OIDC subject claims, this one
          # included (npm/cli#9969). The token is publish-only, limited to this
          # package, and because the account requires 2FA the registry stages the
          # version until a maintainer approves it on npmjs.com. Remove the secret
          # once npm accepts the immutable format (see CONTRIBUTING, "Releasing").
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
      - name: Report whether the version is live or staged
        if: steps.registry.outputs.published == 'false'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@scrape-do/sdo-client@${version}" version --json >/dev/null 2>&1; then
            echo "::notice::@scrape-do/sdo-client@${version} is live on npm."
          else
            echo "::warning::@scrape-do/sdo-client@${version} was accepted but is not live yet: published with the token fallback, the registry stages it. Approve it on npmjs.com (package -> Staged Packages) with 2FA, or run 'npm stage approve'."
          fi

  # `workflow_dispatch` only: proves that npm accepts this workflow's OIDC token
  # for @scrape-do/sdo-client (the trusted publisher configured on npmjs.com)
  # and prints the token claims npm matches against. Nothing is published and
  # the npm token from a successful exchange is never printed.
  publisher-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token with npm
        run: |
          set -euo pipefail
          id_token="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).value)')"
          echo "::add-mask::$id_token"
          node -e '
            const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString("utf8"));
            for (const k of ["sub", "repository", "repository_owner", "repository_id", "workflow_ref",
                             "job_workflow_ref", "environment", "ref", "event_name",
                             "repository_visibility", "runner_environment", "aud"]) {
              console.log(k + ": " + JSON.stringify(claims[k]));
            }' "$id_token"
          code="$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" -H "Accept: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@scrape-do%2fsdo-client")"
          echo "exchange: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "npm accepted the token for @scrape-do/sdo-client (npm token not printed)."
          else
            echo "npm refused the exchange:"; cat exchange.json; echo
            exit 1
          fi
