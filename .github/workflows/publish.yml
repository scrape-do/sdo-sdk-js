# SPDX-License-Identifier: Apache-2.0
# Split build/test (untrusted) -> minimal publish via npm trusted publishing
# (OIDC, no stored token) with provenance. See CONTRIBUTING.md, "Releasing".
#
# The build job refuses a tag that does not match package.json and
# src/version.ts, or that is not on main. The publish job skips (with a notice)
# a version that is already on npm, which is the case for the first version,
# published by hand to bootstrap trusted publishing.
#
# Two channels, chosen by the tag (trunk-based: every tag is on main):
#   vX.Y.Z-rc.N -> npm dist-tag `next`   (environment `prerelease`)
#   vX.Y.Z      -> npm dist-tag `latest` (environment `release`)
name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    # Forks and mirrors never publish.
    if: github.repository_owner == 'scrape-do'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches, for the main-ancestry check
          persist-credentials: false
      - name: Check the tag matches package.json and src/version.ts
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          src="v$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/version.ts)"
          if [ "$GITHUB_REF_NAME" != "$pkg" ] || [ "$GITHUB_REF_NAME" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($pkg) and src/version.ts ($src)" >&2
            exit 1
          fi
      - name: Pick the channel from the tag
        id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "channel=test" >> "$GITHUB_OUTPUT"; echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=live" >> "$GITHUB_OUTPUT"; echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$GITHUB_REF_NAME is neither vX.Y.Z nor vX.Y.Z-rc.N" >&2
            exit 1
          fi
      - name: Refuse tags that are not on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run build
      - run: npm run check:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/
            package.json
            README.md
            LICENSE
            NOTICE

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Manual approval gate: `prerelease` for release candidates, `release` for finals.
    environment: ${{ needs.build.outputs.channel == 'test' && 'prerelease' || 'release' }}
    permissions:
      id-token: write               # trusted publishing + provenance via OIDC
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Trusted publishing needs npm >= 11.5.1; Node 24 bundles it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Require npm >= 11.5.1
        run: |
          node -e '
            const [a, b, c] = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("npm " + [a, b, c].join(".") + " cannot use trusted publishing; need >= 11.5.1");
              process.exit(1);
            }'
      - name: Skip a version that is already on npm
        id: registry
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@scrape-do/sdk@${version}" version --json >/dev/null 2>&1; then
            echo "::notice::@scrape-do/sdk@${version} is already on npm (the hand-published bootstrap version); nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published == 'false'
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
